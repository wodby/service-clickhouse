name: clickhouse
title: ClickHouse
icon: clickhouse
type: datastore
scalable: false

labels:
- clickhouse
- database
- analytics

options:
- version: '26.3'
  tag: '26.3.31.5'
  default: true

  eol: '2027-03-26T00:00:00+00:00'
endpoints:
- name: clickhouse
  ports:
  - name: http
    number: 8123
    protocol: http
    main: true
    private: true
  - name: native
    number: 9000
    protocol: tcp
    private: true

tokens:
- name: database
  value: default
- name: username
  value: wodby
- name: password
  generate:
    regex: '[A-Za-z0-9!@#%_-]{32}'

env:
- name: CLICKHOUSE_DB
  value: '{{database}}'
- name: CLICKHOUSE_USER
  value: '{{username}}'
  secret: true
- name: CLICKHOUSE_PASSWORD
  value: '{{password}}'
  secret: true
- name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
  value: '1'

volumes:
- name: data
  title: ClickHouse data
  size: 20
  helm:
    labels: persistence.labels
    values:
    - name: persistence.enabled
      value: true
    - name: persistence.existingClaim
      value: '{{volumes.data.claim}}'
    - name: persistence.size
      value: '{{volumes.data.size}}Gi'

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/stateful
  chart: oci://registry-1.docker.io/wodby/stateful
  version: 0.2.0
  valueMappings:
    replicas: replicaCount
    nameOverride: nameOverride
    fullnameOverride: fullnameOverride
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create
    strategy: updateStrategy.type
    minReady: minReadySeconds
    shutdownGracePeriod: terminationGracePeriodSeconds
  values:
  - name: containerName
    value: clickhouse
  - name: containerPorts
    value:
    - name: http
      containerPort: 8123
      protocol: TCP
    - name: native
      containerPort: 9000
      protocol: TCP
  - name: headlessService.enabled
    value: false
  - name: persistence.mountPath
    value: /var/lib/clickhouse
  - name: podSecurityContext
    value:
      fsGroup: 101
      fsGroupChangePolicy: OnRootMismatch
  - name: startupProbe
    value:
      httpGet:
        path: /ping
        port: http
      failureThreshold: 30
      periodSeconds: 5
  - name: readinessProbe
    value:
      httpGet:
        path: /ping
        port: http
      periodSeconds: 10
  - name: livenessProbe
    value:
      httpGet:
        path: /ping
        port: http
      initialDelaySeconds: 30
      periodSeconds: 20

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: statefulset
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: clickhouse
    image: clickhouse/clickhouse-server
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts
